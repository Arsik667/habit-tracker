<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Трекер привычек{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script>
    // Ставим тему до отрисовки, чтобы не мигало белым.
    (function () {
      try {
        var saved = localStorage.getItem("theme");
        if (saved) document.documentElement.dataset.theme = saved;
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">🔥 Трекер привычек</a>
    <button class="ghost" id="theme-toggle" type="button" title="Сменить тему">◐</button>
  </header>

  <main class="wrap">
    {% block content %}{% endblock %}
  </main>

  <script>
    document.getElementById("theme-toggle").addEventListener("click", function () {
      var root = document.documentElement;
      var isDark = root.dataset.theme
        ? root.dataset.theme === "dark"
        : window.matchMedia("(prefers-color-scheme: dark)").matches;
      var next = isDark ? "light" : "dark";
      root.dataset.theme = next;
      try { localStorage.setItem("theme", next); } catch (e) {}
    });
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
